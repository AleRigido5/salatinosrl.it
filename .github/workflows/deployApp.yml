name: "🚀 Deploy Laravel SalatinoSRL Gestionale"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout repo
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2) Install Node e build frontend (opzionale)
      # - name: 📦 Build frontend
      #   run: |
      #     npm ci
      #     npm run build

      # 3) Deploy Laravel essentials via FTP
      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: "82.198.228.245"
          username: u394310809.salatinosrlftp
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: /gestionale/
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/.env
            **/storage/framework/**
            **/storage/logs/**
            **/.github/**
            **/tests/**
            **/docker-compose.yml
            **/phpunit.xml
            **/README.md
          dangerous-clean-slate: false
          dry-run: false

            